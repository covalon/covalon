name: The Cabal of Everlasting Rest
type: deity
effects: []
system:
  description:
    gm: ''
    value: >-
      <p>Followers of the Cabal know well the inevitability of life, death, and
      undeath, each a valuable moment in a soul’s journey towards its final
      resting place. This pantheon was originally formed by worshippers of
      various deities working together to handle undead related strife and
      unrest in their communities. The Cabal’s beliefs have expanded beyond its
      founding, with undeath seen as an additional step along a soul’s pathway,
      sometimes taken willingly, sometimes forced, or skipped entirely.
      Followers of the Cabal see it as their duty to guide souls in all stages
      of life along their individual path towards peace. The Cabal’s followers
      include grief counselors, funeral attendants, gravekeepers, and
      undertakers just as often as it includes holy warriors and
      priests.</p><p><strong>Edicts </strong>Guide the living and the dead
      towards peace, Provide counsel to those affected by death and undeath,
      Free unwilling sentient undead from servitude</p><p><strong>Anathema
      </strong>Willingly allow malevolent or mindless undead to attack your
      community, Disrespect the dead</p><p><strong>Pantheon Members
      </strong>Aelia, Golgolgoss, The Gray Ocean, The Path of Great Spirits,
      Unmortis</p>
